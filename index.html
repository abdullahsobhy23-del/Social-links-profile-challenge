<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Main Css Template File -->
    <link rel="stylesheet" href="./CSS/style.css" />

    <!-- Render All Things Normally -->
    <link rel="stylesheet" href="./CSS/Normalize.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="./CSS/all.min.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="flex-container">
          <!-- Jessica Image -->
          <div class="img">
            <img
              src="./assets/images/avatar-jessica.jpeg"
              alt="jessica profile photo"
              height="90"
              width="90"
            />
          </div>

          <!-- Jessica Name -->
          <div class="jessica-name">
            <h2>Jessica Randall</h2>
          </div>

          <!-- Location -->
          <div class="location-paragraph">
            <p>London, United Kingdom</p>
          </div>

          <!-- Job Description -->
          <div class="job-description">
            <p>"Front-end developer and avid reader."</p>
          </div>

          <!-- Links -->
          <div class="links">
            <button type="button"><a href="">GitHub</a></button>
            <button><a href="">Frontend Mentor</a></button>
            <button><a href="">LinkedIn</a></button>
            <button><a href="">Twitter</a></button>
            <button><a href="">Instagram</a></button>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >. Coded by <a href="https://www.frontendmentor.io/profile/abdullahsobhy23-del">Abdullah Mohamed</a>.
      </p>
    </footer>
  </body>
</html>
